services:

  #----------- rendering tile server -------------------
  kosmtik:
    image: kosmtik
    container_name: c-kosmtik
    build:
      context: ./files/docker
      dockerfile: Dockerfile.kosmtik
    volumes:
      - ./files:/osmhike
    depends_on:
      - db
    ports:
      - "127.0.0.1:8888:6789"    # kosmtik standard port 6789 remapped to host port 8888
    environment:
      # database connection
      - PGHOST=db
      - PGUSER=postgres

  #------------ import data -----------------
  import:
    image: import
    container_name: c-import
    build:
      context: ./files/docker
      dockerfile: Dockerfile.import
    volumes:
      - ./files:/osmhike
    depends_on:
      - db
    environment:
      # database connection
      - PGHOST=db
      - PGUSER=postgres
      # osm2pgsql behavior
      - OSM2PGSQL_CACHE
      - OSM2PGSQL_NUMPROC
      # defines the files to use
      - AREAOSM       # osm.pbf file
      - AREAPOLY      # .poly file
      - AREAPOLYSOURCE # defines the source for downloading contours from viewfinderpanoramas.org
      - HIGHRESAREABBOX  # optional: .bbox file (minlon,minlat,maxlon,maxlat) defining the high-res area; contours are clipped to it (+ 0.5° buffer)

  #--------------- database server ------------------
  db:
    image: db
    container_name: c-db
    build:
      context: ./files/docker
      dockerfile: Dockerfile.db
    #ports:
    #  - "127.0.0.1:5432:5432"    # expose Postgres to host for local tools
    shm_size: 512m
    volumes:
      # directory  will be created if does not exist
      - ./database:/var/lib/postgresql/data
      - ./files/dbconf:/dbconf
    environment:
      # database connection
      - PGUSER=postgres
      # Allow passwordless connections (required for PostgreSQL 14+)
      - POSTGRES_HOST_AUTH_METHOD=trust
      # database tuning
      - PG_WORK_MEM
      - PG_MAINTENANCE_WORK_MEM
      - PG_SHARED_BUFFERS
